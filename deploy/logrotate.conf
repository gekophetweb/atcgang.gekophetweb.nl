# Rotates the cron log of deploy/update.sh.
#   sudo cp /opt/atcgang/deploy/logrotate.conf /etc/logrotate.d/atcgang
# Replace "deploy" with the user that runs the crontab (the owner of /var/log/atcgang).
/var/log/atcgang/update.log {
    su deploy deploy
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
}
