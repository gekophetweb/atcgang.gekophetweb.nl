# Dev override: hot reload, db port on localhost only, no tunnel, no backups.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  web:
    image: atcgang-dev
    build:
      context: .
      target: deps
    command: sh -c "pnpm install --frozen-lockfile && (pnpm dev:client & pnpm dev:server)"
    environment:
      NODE_ENV: development
      BASE_URL: http://localhost:5173
      PHOTO_DIR: /data/photos
    volumes:
      - .:/app
      - /app/node_modules
      - photos:/data/photos
    ports:
      - "127.0.0.1:5173:5173"
      - "127.0.0.1:3000:3000"

  db:
    ports:
      - "127.0.0.1:5432:5432"
    # The backend network is internal, so a published port needs a non-internal network too.
    networks: [backend, devdb]

  cloudflared:
    profiles: [tunnel]

  backup:
    profiles: [backup]

networks:
  devdb:
