name: atcgang

services:
  web:
    image: ${WEB_IMAGE:-ghcr.io/gekophetweb/atcgang.gekophetweb.nl:main}
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PHOTO_DIR: /data/photos
    volumes:
      - photos:/data/photos
    # No published ports: only cloudflared reaches web.
    networks: [frontend, backend]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    networks: [frontend]
    depends_on: [web]

  backup:
    build: ./backup
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - photos:/data/photos:ro
      - ${BACKUP_LOCAL_DIR:-./backups}:/backups/local
    # backend to reach db, frontend for the off-site restic repo.
    networks: [backend, frontend]
    depends_on: [db]

networks:
  frontend:
  backend:
    internal: true

volumes:
  pgdata:
  photos:
